# Render blueprint for the NEXORA API (frontend goes on Vercel). FREE tier.
# Free tier has no persistent disk: the database is re-created and re-seeded
# with demo data every time the service restarts or wakes from sleep. That is
# fine for a demo. For persistent data, add a paid disk and set NEXORA_DB.
services:
  - type: web
    name: nexora-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NEXORA_CORS_ORIGINS
        sync: false
      - key: NEXORA_DEVICE_KEY
        generateValue: true
